<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#040b07">
<title>Football Block Breaker — Aura Edition</title>
<style>
/* ==========================================================================
   1. TOKENS
   ========================================================================== */
:root{
  --pitch-1:#33945a;
  --pitch-2:#1a6437;
  --pitch-3:#0d3a20;

  --ink:#eafff2;
  --ink-dim:#b9d9c6;
  --ink-mute:#6f9b83;
  --accent:#8fd4a8;
  --aura:#3ddc84;
  --aura-soft:rgba(61,220,132,.55);

  --glass:rgba(255,255,255,.06);
  --glass-hover:rgba(255,255,255,.12);
  --stroke:rgba(255,255,255,.09);

  --radius-lg:20px;
  --radius-md:10px;
  --radius-sm:7px;

  --shadow-stage:
    0 26px 50px -18px rgba(0,0,0,.9),
    0 0 0 1px rgba(255,255,255,.07),
    0 0 90px -30px rgba(61,220,132,.45);
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*{ box-sizing:border-box; }
html,body{ height:100%; }

body{
  margin:0;
  min-height:100dvh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 50% -10%, #1c4a2c 0%, #0a1a10 45%, #050b07 100%);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  color:var(--ink);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ==========================================================================
   3. LAYOUT SHELL
   ========================================================================== */
.app{
  width: min(94vw, 52vh, 460px);
  width: min(94vw, 52dvh, 460px);
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px 0;
}

/* ==========================================================================
   4. HUD
   ========================================================================== */
.hud{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 4px;
  font-size:.8rem;
}
.hud-item{
  display:flex;
  align-items:baseline;
  gap:6px;
  padding:6px 10px;
  border-radius:var(--radius-md);
  background:var(--glass);
  border:1px solid var(--stroke);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.hud-label{
  font-size:.6rem;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
}
.hud-value{ font-weight:800; font-variant-numeric: tabular-nums; }
#lives{ font-size:.85rem; line-height:1; letter-spacing:1px; }
.spacer{ flex:1; }

.icon-btn{
  width:36px; height:36px;
  display:grid; place-items:center;
  border-radius:var(--radius-md);
  border:1px solid var(--stroke);
  background:var(--glass);
  color:var(--ink);
  font-size:1rem;
  cursor:pointer;
  transition: background .15s ease, transform .1s ease;
}
.icon-btn:hover{ background:var(--glass-hover); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn:focus-visible{ outline:2px solid #7cf0ae; outline-offset:2px; }

/* ==========================================================================
   5. STAGE + PITCH
   ========================================================================== */
.stage{
  position:relative;
  isolation:isolate;
  width:100%;
  aspect-ratio: 5 / 7;
  border-radius:var(--radius-lg);
  box-shadow: var(--shadow-stage);
}

/* pulsing aura halo behind the pitch */
.stage::before{
  content:"";
  position:absolute;
  inset:-16px;
  z-index:-1;
  border-radius:32px;
  background:
    radial-gradient(circle at 50% 12%, rgba(61,220,132,.55), transparent 62%),
    radial-gradient(circle at 50% 100%, rgba(60,180,255,.35), transparent 60%);
  filter: blur(24px);
  animation: auraPulse 5.5s ease-in-out infinite;
}

.stage.shake{ animation: shake .34s cubic-bezier(.36,.07,.19,.97); }

.pitch{
  position:absolute;
  inset:0;
  border-radius:var(--radius-lg);
  overflow:hidden;
  touch-action:none;
  cursor:none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.045) 0 8.333%,
      rgba(0,0,0,.05)        8.333% 16.666%
    ),
    radial-gradient(
      circle at 50% 0%,
      var(--pitch-1) 0%,
      var(--pitch-2) 48%,
      var(--pitch-3) 100%
    );
  box-shadow: inset 0 0 70px rgba(0,0,0,.6);
}

/* slow light sweep across the grass */
.pitch::after{
  content:"";
  position:absolute;
  inset:-40%;
  pointer-events:none;
  background: linear-gradient(115deg,
    transparent 40%,
    rgba(180,255,215,.07) 50%,
    transparent 60%);
  animation: sweep 9s ease-in-out infinite;
}

.lines{
  position:absolute; inset:9px;
  border:2px solid rgba(255,255,255,.13);
  border-radius:13px;
  pointer-events:none;
}
.lines .halfway{
  position:absolute; left:0; right:0; top:50%;
  height:2px; margin-top:-1px;
  background:rgba(255,255,255,.11);
}
.lines .circle{
  position:absolute; left:50%; top:50%;
  width:34%; aspect-ratio:1;
  transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.11);
  border-radius:50%;
}

.bricks, .ball, .paddle{ pointer-events:none; }

/* ==========================================================================
   6. BRICKS — with 3D entrance
   ========================================================================== */
.brick{
  position:absolute;
  left:0; top:0;
  border-radius:var(--radius-sm);
  transform: translate(var(--tx,0px), var(--ty,0px));
  background: linear-gradient(180deg, var(--c1,#fff), var(--c2,#ccc));
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.6),
    inset 0 -3px 0 rgba(0,0,0,.16),
    0 3px 7px rgba(0,0,0,.4);
  will-change: transform;
  animation: brickIn .5s cubic-bezier(.2,.9,.3,1.4) backwards;
  animation-delay: var(--in, 0s);
}

.brick.tough{
  box-shadow:
    inset 0 0 0 2px rgba(0,0,0,.18),
    inset 0 2px 0 rgba(255,255,255,.5),
    0 3px 7px rgba(0,0,0,.4);
}

.brick.cracked{ filter: brightness(.8) saturate(.65); }

.brick.hit{ animation: brickPop .2s ease forwards; }

@keyframes brickIn{
  from{ transform: translate(var(--tx,0px), var(--ty,0px)) scale(.2) rotateZ(-12deg); opacity:0; }
  to  { transform: translate(var(--tx,0px), var(--ty,0px)) scale(1)  rotateZ(0);      opacity:1; }
}
@keyframes brickPop{
  from{ transform: translate(var(--tx,0px), var(--ty,0px)) scale(1);   opacity:1; }
  to  { transform: translate(var(--tx,0px), var(--ty,0px)) scale(.35); opacity:0; }
}

/* ==========================================================================
   7. KEEPER
   ========================================================================== */
.paddle{
  position:absolute;
  left:0; top:0;
  z-index:4;
  border-radius:999px;
  will-change: transform;
  background: linear-gradient(180deg,#ffffff 0%, #b7f0cf 45%, #43c07d 100%);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.35),
    0 10px 18px -4px rgba(0,0,0,.6),
    inset 0 -4px 0 rgba(0,0,0,.13),
    0 0 22px rgba(70,230,150,.5);
}

/* ==========================================================================
   8. BALL — 3D shaded, spinning panel pattern
   ========================================================================== */
.ball{
  position:absolute;
  left:0; top:0;
  z-index:5;
  border-radius:50%;
  will-change: transform;
  background: radial-gradient(circle at 32% 28%, #ffffff 0%, #f2f2ef 45%, #c9cfc8 100%);
  box-shadow:
    inset -3px -4px 9px rgba(0,0,0,.22),
    inset 3px 3px 8px rgba(255,255,255,.85),
    0 5px 12px rgba(0,0,0,.5),
    0 0 18px rgba(120,255,190,.35);
}

.ball::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, #16281c 0 20%, transparent 22%),
    radial-gradient(circle at 50%  2%, #16281c 0 11%, transparent 13%),
    radial-gradient(circle at  2% 50%, #16281c 0 11%, transparent 13%),
    radial-gradient(circle at 98% 50%, #16281c 0 11%, transparent 13%),
    radial-gradient(circle at 50% 98%, #16281c 0 11%, transparent 13%);
  opacity:.92;
  animation: ballRoll 2.6s linear infinite;
}

/* ==========================================================================
   9. OVERLAY
   ========================================================================== */
.overlay{
  position:absolute;
  inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  padding:22px;
  border-radius:var(--radius-lg);
  background: radial-gradient(circle at 50% 40%, rgba(8,32,18,.78), rgba(2,8,5,.9));
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  transition: opacity .25s ease, visibility .25s ease;
}
.overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

.card{ max-width:300px; text-align:center; }

.card h1{
  margin:0 0 10px;
  font-size: clamp(1.15rem, 5vw, 1.55rem);
  line-height:1.15;
  letter-spacing:-.01em;
  background: linear-gradient(180deg,#ffffff,#7cf0ae);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  filter: drop-shadow(0 4px 14px rgba(60,220,140,.35));
}

.card p{
  margin:0 0 20px;
  font-size:.85rem;
  line-height:1.55;
  color:var(--ink-dim);
}

.btn{
  appearance:none; border:0;
  padding:13px 32px;
  border-radius:999px;
  font: inherit;
  font-weight:800;
  font-size:.95rem;
  letter-spacing:.03em;
  color:#06280f;
  background: linear-gradient(180deg,#c8ffdd,#3ddc84);
  box-shadow: 0 6px 0 #189552, 0 16px 26px -10px rgba(61,220,132,.7);
  cursor:pointer;
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #189552, 0 8px 16px -10px rgba(61,220,132,.7); }
.btn:focus-visible{ outline:2px solid #7cf0ae; outline-offset:4px; }

.hint{
  margin:0;
  text-align:center;
  font-size:.68rem;
  letter-spacing:.04em;
  color:var(--ink-mute);
}

/* ==========================================================================
   10. LOADER / AURA START SCREEN
   ========================================================================== */
#loader{
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%, #0e2e1c 0%, #06110b 46%, #020504 100%);
  transition: opacity .75s ease, transform .75s ease, visibility .75s;
}
#loader.out{
  opacity:0;
  transform: scale(1.1);
  visibility:hidden;
  pointer-events:none;
}

/* --- rotating aura veils ------------------------------------------------ */
.aura{
  position:absolute;
  width:min(160vw,160vh);
  aspect-ratio:1;
  border-radius:50%;
  pointer-events:none;
  filter: blur(64px);
  opacity:.55;
  background: conic-gradient(from 0deg,
    transparent 0%,
    rgba(61,220,132,.30) 12%,
    transparent 26%,
    rgba(60,180,255,.20) 50%,
    transparent 64%,
    rgba(120,255,190,.26) 82%,
    transparent 100%);
  animation: spin 16s linear infinite;
}
.aura.b{
  animation-duration:24s;
  animation-direction:reverse;
  filter: blur(88px);
  opacity:.35;
}
.aura.c{
  animation-duration:34s;
  filter: blur(110px);
  opacity:.28;
  background: radial-gradient(circle, rgba(61,220,132,.55), transparent 62%);
}

/* --- loader stack ------------------------------------------------------- */
.loader-inner{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  padding:24px;
  text-align:center;
}

/* --- 3D orb ------------------------------------------------------------- */
.orb{
  position:relative;
  width:190px;
  height:190px;
  perspective:800px;
  transform-style:preserve-3d;
  animation: floatY 5.5s ease-in-out infinite;
}

/* glowing core */
.orb-core{
  position:absolute;
  inset:19%;
  border-radius:50%;
  background: radial-gradient(circle at 34% 28%,
    #f2fff8 0%, #9dfbc4 26%, #2fbf72 58%, #0a4c2a 100%);
  box-shadow:
    0 0 34px rgba(80,255,160,.85),
    0 0 90px rgba(40,200,120,.5),
    inset -12px -16px 34px rgba(0,0,0,.5),
    inset 10px 10px 24px rgba(255,255,255,.6);
  animation: corePulse 3.4s ease-in-out infinite;
}
/* rotating football panels on the core */
.orb-core::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, rgba(8,40,22,.9) 0 18%, transparent 20%),
    radial-gradient(circle at 50%  3%, rgba(8,40,22,.85) 0 10%, transparent 12%),
    radial-gradient(circle at  3% 50%, rgba(8,40,22,.85) 0 10%, transparent 12%),
    radial-gradient(circle at 97% 50%, rgba(8,40,22,.85) 0 10%, transparent 12%),
    radial-gradient(circle at 50% 97%, rgba(8,40,22,.85) 0 10%, transparent 12%);
  opacity:.75;
  animation: ballRoll 5s linear infinite;
}

/* gyroscope rings */
.gyro{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  animation: gyroSpin 9s linear infinite;
}
.gyro.g2{ animation: gyroSpin2 13s linear infinite; }

.gyro .ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px solid rgba(140,255,200,.5);
  box-shadow:
    0 0 16px rgba(90,255,170,.55),
    inset 0 0 16px rgba(90,255,170,.35);
}
.gyro .ring:nth-child(1){ transform: rotateY(0deg);   }
.gyro .ring:nth-child(2){ transform: rotateY(60deg);  }
.gyro .ring:nth-child(3){ transform: rotateY(120deg); }
.gyro.g2 .ring:nth-child(1){ transform: rotateX(70deg); border-color: rgba(120,200,255,.45); }
.gyro.g2 .ring:nth-child(2){ transform: rotateX(110deg); border-color: rgba(120,200,255,.3); }

/* orbiting particles */
.particles{ position:absolute; inset:0; }
.particle{
  position:absolute;
  left:50%; top:50%;
  width:6px; height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;
  background: radial-gradient(circle,#e6fff1,#3ddc84);
  box-shadow: 0 0 10px rgba(90,255,170,.95);
  animation: orbit var(--dur,7s) linear infinite;
  animation-delay: var(--delay,0s);
  will-change: transform;
}

/* --- typography --------------------------------------------------------- */
.loader-title{
  margin:0;
  font-size: clamp(1.5rem, 7vw, 2.1rem);
  line-height:1.08;
  font-weight:900;
  letter-spacing:.04em;
  text-transform:uppercase;
  background: linear-gradient(180deg,#ffffff 0%,#b6ffd6 45%,#2fbf72 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  filter: drop-shadow(0 6px 22px rgba(61,220,132,.45));
  animation: titleIn .9s cubic-bezier(.2,.9,.3,1.2) .15s backwards;
}
.loader-title span{
  display:block;
  font-size:.78em;
  letter-spacing:.16em;
  background: linear-gradient(180deg,#d9ffe9,#3ddc84);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}
.loader-sub{
  margin:-8px 0 0;
  font-size:.66rem;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:var(--ink-mute);
  animation: fadeUp .9s ease .4s backwards;
}

/* --- progress ----------------------------------------------------------- */
.load-track{
  position:relative;
  width:min(74vw,260px);
  height:6px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.6);
  transition: opacity .45s ease, transform .45s ease;
}
.load-fill{
  position:absolute;
  inset:0 auto 0 0;
  width:0%;
  border-radius:999px;
  background: linear-gradient(90deg,#1f9b5c,#3ddc84 55%,#c8ffdd);
  box-shadow: 0 0 18px rgba(61,220,132,.9);
  transition: width .12s linear;
}
.load-pct{
  font-size:.66rem;
  letter-spacing:.3em;
  color:var(--accent);
  font-variant-numeric: tabular-nums;
  transition: opacity .45s ease, transform .45s ease;
}

/* --- kick-off button ---------------------------------------------------- */
.kick{
  opacity:0;
  transform: translateY(18px) scale(.9);
  pointer-events:none;
  transition: opacity .5s ease, transform .5s cubic-bezier(.2,.9,.3,1.4);
  padding:15px 44px;
  font-size:1rem;
  letter-spacing:.14em;
  animation: kickGlow 2.4s ease-in-out infinite;
}

/* ready state */
#loader.ready .load-track,
#loader.ready .load-pct{
  opacity:0;
  transform: translateY(-8px);
  pointer-events:none;
}
#loader.ready .kick{
  opacity:1;
  transform: translateY(0) scale(1);
  pointer-events:auto;
}

/* ==========================================================================
   11. KEYFRAMES
   ========================================================================== */
@keyframes spin{ to{ transform: rotate(360deg); } }

@keyframes gyroSpin{
  from{ transform: rotate3d(1,.55,0,0deg); }
  to  { transform: rotate3d(1,.55,0,360deg); }
}
@keyframes gyroSpin2{
  from{ transform: rotate3d(.45,1,0,0deg); }
  to  { transform: rotate3d(.45,1,0,-360deg); }
}

@keyframes corePulse{
  0%,100%{ transform: scale(1);    filter: brightness(1); }
  50%    { transform: scale(1.07); filter: brightness(1.2); }
}

@keyframes floatY{
  0%,100%{ transform: translateY(0); }
  50%    { transform: translateY(-12px); }
}

@keyframes orbit{
  from{ transform: rotate(var(--a,0deg)) translateX(var(--r,90px)) scale(var(--s,1)); }
  to  { transform: rotate(calc(var(--a,0deg) + 360deg)) translateX(var(--r,90px)) scale(var(--s,1)); }
}

@keyframes ballRoll{ to{ transform: rotate(360deg); } }

@keyframes auraPulse{
  0%,100%{ opacity:.35; transform: scale(.97); }
  50%    { opacity:.72; transform: scale(1.03); }
}

@keyframes sweep{
  0%,100%{ transform: translateX(-35%) rotate(0deg); opacity:.5; }
  50%    { transform: translateX(35%)  rotate(0deg); opacity:1; }
}

@keyframes shake{
  10%,90%{ transform: translateX(-3px); }
  20%,80%{ transform: translateX(5px); }
  30%,50%,70%{ transform: translateX(-7px); }
  40%,60%{ transform: translateX(7px); }
}

@keyframes titleIn{
  from{ opacity:0; transform: translateY(16px) scale(.94); letter-spacing:.2em; }
  to  { opacity:1; transform: translateY(0) scale(1); letter-spacing:.04em; }
}
@keyframes fadeUp{
  from{ opacity:0; transform: translateY(10px); }
  to  { opacity:1; transform: translateY(0); }
}
@keyframes kickGlow{
  0%,100%{ box-shadow: 0 6px 0 #189552, 0 16px 26px -10px rgba(61,220,132,.7); }
  50%    { box-shadow: 0 6px 0 #189552, 0 20px 42px -8px rgba(61,220,132,1); }
}

/* ==========================================================================
   12. RESPONSIVE + A11Y
   ========================================================================== */
@media (max-width: 360px){
  .hud{ font-size:.72rem; gap:6px; }
  .hud-item{ padding:5px 8px; }
  .hud-label{ font-size:.55rem; letter-spacing:.1em; }
  .icon-btn{ width:32px; height:32px; }
  .hint{ font-size:.62rem; }
  .orb{ width:150px; height:150px; }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.001s !important;
    animation-iteration-count:1 !important;
    transition-duration:.001s !important;
  }
  #loader.ready .kick{ opacity:1; transform:none; pointer-events:auto; }
}
</style>
</head>
<body>

<!-- ==================== AURA LOADER / START SCREEN ==================== -->
<div id="loader">
  <div class="aura a"></div>
  <div class="aura b"></div>
  <div class="aura c"></div>

  <div class="loader-inner">
    <div class="orb">
      <div class="gyro g1">
        <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      </div>
      <div class="gyro g2">
        <span class="ring"></span><span class="ring"></span>
      </div>
      <div class="orb-core"></div>
      <div class="particles" id="particles"></div>
    </div>

    <h1 class="loader-title">Football<span>Block Breaker</span></h1>
    <p class="loader-sub">Aura Edition</p>

    <div class="load-track"><div class="load-fill" id="loadFill"></div></div>
    <div class="load-pct" id="loadPct">0%</div>

    <button class="btn kick" id="kickOff">KICK OFF</button>
  </div>
</div>

<!-- ============================ GAME ============================ -->
<div class="app">

  <div class="hud">
    <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="score">0</span></div>
    <div class="hud-item"><span class="hud-label">Lvl</span><span class="hud-value" id="level">1</span></div>
    <div class="hud-item"><span class="hud-label">Balls</span><span class="hud-value" id="lives">⚽⚽⚽</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="mute" aria-label="Toggle sound">🔊</button>
  </div>

  <div class="stage" id="stage">
    <div class="pitch" id="pitch">
      <div class="lines"><div class="halfway"></div><div class="circle"></div></div>
      <div class="bricks" id="bricks"></div>
      <div class="paddle" id="paddle"></div>
      <div class="ball" id="ball"></div>

      <div class="overlay hidden" id="overlay">
        <div class="card">
          <h1 id="ovTitle">Football Block Breaker</h1>
          <p id="ovText">Slide the keeper, smash every block.</p>
          <button class="btn" id="ovBtn">Kick Off</button>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">Move: mouse / touch / ← → &nbsp;•&nbsp; Launch: Space or tap &nbsp;•&nbsp; Pause: P</p>
</div>

<script>
(function () {
  'use strict';

  /* ======================================================================
     ELEMENTS
     ====================================================================== */
  const pitch    = document.getElementById('pitch');
  const stage    = document.getElementById('stage');
  const bricksEl = document.getElementById('bricks');
  const ballEl   = document.getElementById('ball');
  const paddleEl = document.getElementById('paddle');
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ovTitle');
  const ovText   = document.getElementById('ovText');
  const ovBtn    = document.getElementById('ovBtn');
  const scoreEl  = document.getElementById('score');
  const levelEl  = document.getElementById('level');
  const livesEl  = document.getElementById('lives');
  const muteBtn  = document.getElementById('mute');

  const loader   = document.getElementById('loader');
  const loadFill = document.getElementById('loadFill');
  const loadPct  = document.getElementById('loadPct');
  const kickOff  = document.getElementById('kickOff');
  const particles= document.getElementById('particles');

  /* ======================================================================
     CONSTANTS
     ====================================================================== */
  const COLS       = 7;
  const MAX_ROWS   = 7;
  const BASE_SPEED = 300;    // px/s
  const SPEED_STEP = 26;
  const MAX_STEP   = 1 / 180;
  const PADDLE_KEYS= 620;    // px/s

  const PALETTE = [
    ['#ffffff', '#cbd7cf'],
    ['#8ef7b4', '#22a35a'],
    ['#ffe58a', '#e0a41b'],
    ['#9fd8ff', '#2b7fc4'],
    ['#ffb6c4', '#d64b64'],
    ['#d6bcff', '#7a4fd6'],
    ['#ffd0a1', '#d97a2b']
  ];

  /* ======================================================================
     STATE
     ====================================================================== */
  let W = 1, H = 1;
  let status = 'menu';            // menu | serve | play | paused | over
  let score = 0, lives = 3, level = 1, rows = 4;
  let soundOn = true;
  let started = false;            // has the player pressed KICK OFF?

  const ball   = { x: 0, y: 0, vx: 0, vy: 0, r: 9 };
  const paddle = { x: 0, y: 0, w: 90, h: 14, bottom: 26 };
  let bricks = [];
  const keys = { left: false, right: false };
  let lastT = 0;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /* ======================================================================
     AUDIO
     ====================================================================== */
  let actx = null;
  function beep(freq, dur, type, vol) {
    if (!soundOn) return;
    dur = dur || 0.07; type = type || 'square'; vol = vol || 0.05;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    } catch (e) { /* silent */ }
  }

  /* ======================================================================
     LAYOUT
     ====================================================================== */
  function measure() {
    const rect = pitch.getBoundingClientRect();
    W = Math.max(1, rect.width);
    H = Math.max(1, rect.height);

    ball.r = Math.max(6, W * 0.022);
    ballEl.style.width = ballEl.style.height = (ball.r * 2) + 'px';

    paddle.w = Math.max(56, W * 0.23);
    paddle.h = Math.max(10, H * 0.018);
    paddle.bottom = H * 0.05;
    paddle.y = H - paddle.h - paddle.bottom;
    paddleEl.style.width  = paddle.w + 'px';
    paddleEl.style.height = paddle.h + 'px';

    paddle.x = clamp(paddle.x || (W - paddle.w) / 2, 0, W - paddle.w);
  }

  function layoutBricks() {
    if (!bricks.length) return;
    const padX = W * 0.045;
    const gapX = W * 0.018;
    const bw   = (W - padX * 2 - gapX * (COLS - 1)) / COLS;
    const bh   = Math.min(H * 0.048, bw * 1.25);
    const gapY = H * 0.013;
    const top  = H * 0.085;

    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      b.w = bw; b.h = bh;
      b.x = padX + b.col * (bw + gapX);
      b.y = top  + b.row * (bh + gapY);
      b.el.style.width  = bw + 'px';
      b.el.style.height = bh + 'px';
      b.el.style.setProperty('--tx', b.x + 'px');
      b.el.style.setProperty('--ty', b.y + 'px');
    }
  }

  /* ======================================================================
     LEVEL BUILD
     ====================================================================== */
  function buildBricks() {
    bricksEl.innerHTML = '';
    bricks = [];
    rows = Math.min(MAX_ROWS, 4 + Math.min(3, level - 1));

    for (let r = 0; r < rows; r++) {
      const pal = PALETTE[r % PALETTE.length];
      const hp  = r < (level - 1) ? 2 : 1;
      for (let c = 0; c < COLS; c++) {
        const el = document.createElement('div');
        el.className = 'brick' + (hp > 1 ? ' tough' : '');
        el.style.setProperty('--c1', pal[0]);
        el.style.setProperty('--c2', pal[1]);
        el.style.setProperty('--in', (r * 0.045 + c * 0.022).toFixed(3) + 's');
        bricksEl.appendChild(el);

        bricks.push({
          el: el, row: r, col: c,
          hp: hp, points: (rows - r) * 10,
          alive: true, x: 0, y: 0, w: 0, h: 0
        });
      }
    }
    layoutBricks();
  }

  /* ======================================================================
     HUD + OVERLAY
     ====================================================================== */
  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    livesEl.textContent = '⚽'.repeat(Math.max(0, lives)) || '—';
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent  = text;
    ovBtn.textContent   = btn;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  /* ======================================================================
     GAME FLOW
     ====================================================================== */
  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.vx = ball.vy = 0;
  }

  function startGame() {
    score = 0; lives = 3; level = 1;
    measure();
    buildBricks();
    updateHUD();
    hideOverlay();
    serve();
  }

  function serve() {
    status = 'serve';
    placeBallOnPaddle();
    updateHUD();
  }

  function launch() {
    if (status !== 'serve') return;
    status = 'play';
    const speed = BASE_SPEED + (level - 1) * SPEED_STEP;
    const a = (Math.random() * 2 - 1) * 0.36;
    ball.vx = Math.sin(a) * speed;
    ball.vy = -Math.cos(a) * speed;
    beep(660, 0.06, 'sine', 0.05);
  }

  function shakeStage() {
    stage.classList.remove('shake');
    void stage.offsetWidth;      // restart animation
    stage.classList.add('shake');
  }

  function loseLife() {
    lives--;
    updateHUD();
    shakeStage();
    beep(150, 0.28, 'sawtooth', 0.06);
    if (lives <= 0) gameOver(); else serve();
  }

  function gameOver() {
    status = 'over';
    ball.vx = ball.vy = 0;
    showOverlay('Full Time',
      'You scored ' + score + ' points and reached level ' + level + '.',
      'Play Again');
  }

  function nextLevel() {
    level++;
    score += 100;
    updateHUD();
    beep(880, 0.1, 'sine', 0.06);
    setTimeout(() => beep(1180, 0.14, 'sine', 0.06), 90);
    buildBricks();
    serve();
  }

  function togglePause() {
    if (status === 'play') {
      status = 'paused';
      showOverlay('Paused', 'Take a breather. The blocks aren\'t going anywhere.', 'Resume');
    } else if (status === 'paused') {
      hideOverlay();
      status = 'play';
      lastT = 0;
    }
  }

  /* ======================================================================
     COLLISION
     ====================================================================== */
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function resolveBrick(b) {
    const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
    const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
    const dx = ball.x - nx, dy = ball.y - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 > ball.r * ball.r) return false;

    if (d2 > 0.0001) {
      const d = Math.sqrt(d2);
      const ux = dx / d, uy = dy / d;
      ball.x = nx + ux * ball.r;
      ball.y = ny + uy * ball.r;
      const dot = ball.vx * ux + ball.vy * uy;
      if (dot < 0) { ball.vx -= 2 * dot * ux; ball.vy -= 2 * dot * uy; }
    } else {
      const left = ball.x - b.x, right = b.x + b.w - ball.x;
      const top  = ball.y - b.y, bottom = b.y + b.h - ball.y;
      const m = Math.min(left, right, top, bottom);
      if (m === left)       { ball.x = b.x - ball.r;       ball.vx = -Math.abs(ball.vx); }
      else if (m === right) { ball.x = b.x + b.w + ball.r; ball.vx =  Math.abs(ball.vx); }
      else if (m === top)   { ball.y = b.y - ball.r;       ball.vy = -Math.abs(ball.vy); }
      else                  { ball.y = b.y + b.h + ball.r; ball.vy =  Math.abs(ball.vy); }
    }
    return true;
  }

  function damageBrick(b) {
    b.hp--;
    if (b.hp <= 0) {
      b.alive = false;
      b.el.classList.add('hit');
      const el = b.el;
      setTimeout(() => el.remove(), 220);
      score += b.points;
      beep(300 + (rows - b.row) * 55, 0.06, 'square', 0.045);
    } else {
      b.el.classList.add('cracked');
      score += 5;
      beep(200, 0.05, 'triangle', 0.05);
    }
    updateHUD();
  }

  /* ======================================================================
     PHYSICS
     ====================================================================== */
  function physics(dt) {
    if (status === 'serve') {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }
    if (status !== 'play') return;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    /* walls */
    if (ball.x - ball.r < 0)      { ball.x = ball.r;      ball.vx =  Math.abs(ball.vx); beep(420,0.04,'square',0.035); }
    else if (ball.x + ball.r > W) { ball.x = W - ball.r;  ball.vx = -Math.abs(ball.vx); beep(420,0.04,'square',0.035); }

    if (ball.y - ball.r < 0)      { ball.y = ball.r;      ball.vy =  Math.abs(ball.vy); beep(420,0.04,'square',0.035); }

    /* keeper */
    if (ball.vy > 0 && circleRect(ball.x, ball.y, ball.r, paddle.x, paddle.y, paddle.w, paddle.h)) {
      const rel = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const ang = rel * (Math.PI / 3);
      const sp  = Math.hypot(ball.vx, ball.vy) || BASE_SPEED;
      ball.vx = Math.sin(ang) * sp;
      ball.vy = -Math.cos(ang) * sp;
      ball.y  = paddle.y - ball.r - 0.5;
      beep(520, 0.05, 'sine', 0.05);
    }

    /* bricks */
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!b.alive) continue;
      if (resolveBrick(b)) { damageBrick(b); break; }
    }

    /* anti-stall: keep the ball from going too flat */
    const sp2 = Math.hypot(ball.vx, ball.vy);
    if (sp2 > 1) {
      const minVy = sp2 * 0.22;
      if (Math.abs(ball.vy) < minVy) {
        ball.vy = (ball.vy < 0 ? -1 : 1) * minVy;
        const k = sp2 / Math.hypot(ball.vx, ball.vy);
        ball.vx *= k; ball.vy *= k;
      }
    }

    /* lost ball */
    if (ball.y - ball.r > H) { loseLife(); return; }

    /* level cleared */
    let remaining = 0;
    for (let i = 0; i < bricks.length; i++) if (bricks[i].alive) { remaining++; break; }
    if (remaining === 0) nextLevel();
  }

  function update(dt) {
    let remaining = dt, guard = 0;
    while (remaining > 0.0001 && guard++ < 40) {
      const s = Math.min(remaining, MAX_STEP);
      physics(s);
      remaining -= s;
      if (status !== 'play') break;
    }
  }

  /* ======================================================================
     RENDER
     ====================================================================== */
  function render() {
    paddleEl.style.transform = 'translate(' + paddle.x + 'px,' + paddle.y + 'px)';
    ballEl.style.transform   = 'translate(' + (ball.x - ball.r) + 'px,' + (ball.y - ball.r) + 'px)';
  }

  /* ======================================================================
     MAIN LOOP
     ====================================================================== */
  function loop(t) {
    requestAnimationFrame(loop);

    if (!lastT) lastT = t;
    let dt = (t - lastT) / 1000;
    lastT = t;
    dt = Math.min(dt, 0.05);

    if (status === 'play' || status === 'serve') {
      let moved = false;
      if (keys.left)  { paddle.x -= PADDLE_KEYS * dt; moved = true; }
      if (keys.right) { paddle.x += PADDLE_KEYS * dt; moved = true; }
      if (moved) paddle.x = clamp(paddle.x, 0, W - paddle.w);
    }

    if (status === 'play') update(dt);
    render();
  }

  /* ======================================================================
     INPUT
     ====================================================================== */
  function movePaddleTo(clientX) {
    const rect = pitch.getBoundingClientRect();
    paddle.x = clamp(clientX - rect.left - paddle.w / 2, 0, W - paddle.w);
  }

  pitch.addEventListener('pointermove', e => movePaddleTo(e.clientX), { passive: true });

  pitch.addEventListener('pointerdown', function (e) {
    if (!started) return;
    movePaddleTo(e.clientX);
    if (status === 'serve') launch();
    else if (status === 'paused') togglePause();
  });

  ovBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (status === 'paused') togglePause();
    else startGame();
  });

  window.addEventListener('keydown', function (e) {
    if (!started) return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (status === 'serve') launch();
      else if (status === 'paused') togglePause();
      else if (status === 'over') startGame();
      return;
    }
    if (e.code === 'ArrowLeft'  || e.code === 'KeyA') { keys.left  = true; e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; e.preventDefault(); }
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  });

  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keys.left  = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    soundOn = !soundOn;
    muteBtn.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) beep(700, 0.06, 'sine', 0.05);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && status === 'play') togglePause();
  });

  /* ======================================================================
     RESIZE
     ====================================================================== */
  let resizeTimer = null;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      measure();
      layoutBricks();
      if (status === 'serve' || status === 'menu') placeBallOnPaddle();
      else ball.x = clamp(ball.x, ball.r, W - ball.r);
      render();
    }, 120);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  /* ======================================================================
     LOADER — 3D aura start screen
     ====================================================================== */
  (function buildParticles() {
    const N = 22;
    for (let i = 0; i < N; i++) {
      const p = document.createElement('span');
      p.className = 'particle';
      p.style.setProperty('--a', (i * (360 / N) + Math.random() * 9).toFixed(1) + 'deg');
      p.style.setProperty('--r', (66 + Math.random() * 48).toFixed(1) + 'px');
      p.style.setProperty('--s', (0.45 + Math.random() * 1.1).toFixed(2));
      p.style.setProperty('--dur', (5 + Math.random() * 6).toFixed(2) + 's');
      p.style.setProperty('--delay', (-Math.random() * 9).toFixed(2) + 's');
      p.style.opacity = (0.3 + Math.random() * 0.65).toFixed(2);
      particles.appendChild(p);
    }
  })();

  (function runLoader() {
    const DURATION = 2600;
    let start = null;

    function tick(t) {
      if (!start) start = t;
      const p = Math.min(1, (t - start) / DURATION);
      const eased = 1 - Math.pow(1 - p, 2.2);       // ease-out
      loadFill.style.width = (eased * 100).toFixed(1) + '%';
      loadPct.textContent  = Math.round(eased * 100) + '%';
      if (p < 1) requestAnimationFrame(tick);
      else setTimeout(() => loader.classList.add('ready'), 240);
    }
    requestAnimationFrame(tick);

    kickOff.addEventListener('click', function () {
      if (started) return;
      started = true;

      beep(520, 0.07, 'sine', 0.06);
      setTimeout(() => beep(780, 0.12, 'sine', 0.06), 80);

      loader.classList.add('out');
      startGame();

      setTimeout(() => { loader.style.display = 'none'; }, 850);
    });
  })();

  /* ======================================================================
     BOOT
     ====================================================================== */
  requestAnimationFrame(function () {
    measure();
    buildBricks();
    placeBallOnPaddle();
    updateHUD();
    render();
    requestAnimationFrame(loop);
  });

})();
</script>
</body>
</html>
